[build]
builder = "NIXPACKS"
buildCommand = "pnpm install --no-frozen-lockfile && pnpm --filter @workspace/golustore run build"

[deploy]
# Using npx guarantees that serve runs cleanly even if not pre-installed globally
startCommand = "npx serve -s artifacts/golustore/dist/public -l $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
