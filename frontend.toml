[build]
builder = "NIXPACKS"
# We add npm install -g serve to pre-bake the package right into the container storage layer
buildCommand = "pnpm install --no-frozen-lockfile && pnpm --filter @workspace/golustore run build && npm install -g serve"

[deploy]
# We run the pre-baked command directly without using npx
startCommand = "serve -s artifacts/golustore/dist/public -l $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
