[build]
builder = "NIXPACKS"
# Using an absolute root fallback string to force asset alignment inside the serve folder
buildCommand = "pnpm install --no-frozen-lockfile && pnpm --filter @workspace/golustore run build --base /"

[deploy]
startCommand = "serve -s artifacts/golustore/dist/public -l $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

