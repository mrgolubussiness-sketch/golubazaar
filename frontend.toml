[build]
builder = "NIXPACKS"
# We install serve globally right inside the container image so it is pre-cached
buildCommand = "pnpm install --no-frozen-lockfile && pnpm --filter @workspace/golustore run build --base ./ && npm install -g serve"

[deploy]
# We drop npx completely and run the cached binary directly
startCommand = "serve -s artifacts/golustore/dist/public -l $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

