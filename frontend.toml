[build]
builder = "NIXPACKS"
buildCommand = "pnpm install --no-frozen-lockfile && pnpm add -w serve && pnpm --filter @workspace/golustore run build"

[deploy]
# Points strictly into the subfolder where your real entry assets live
startCommand = "pnpm exec serve -s artifacts/golustore/dist/public -l $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
