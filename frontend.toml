[build]
builder = "NIXPACKS"
buildCommand = "pnpm install --no-frozen-lockfile && pnpm --filter @workspace/golustore run build"

[deploy]
# Using the absolute safest, standard npx tool configuration to serve raw assets safely
startCommand = "npx serve -s artifacts/golustore/dist -l $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
