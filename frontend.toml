[build]
builder = "NIXPACKS"
# The --base ./ flag forces Vite to search inside its local compiled folders for asset bundles
buildCommand = "pnpm install --no-frozen-lockfile && pnpm --filter @workspace/golustore run build --base ./"

[deploy]
# Points cleanly inside your active compiled static UI package asset tree
startCommand = "npx serve -s artifacts/golustore/dist/public -l $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

