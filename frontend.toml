[build]
builder = "NIXPACKS"
buildCommand = "pnpm install --no-frozen-lockfile && pnpm --filter @workspace/golustore run build"

[deploy]
# 'serve -s' ensures all browser routes gracefully fall back to index.html
startCommand = "npx serve -s artifacts/golustore/dist -l $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
