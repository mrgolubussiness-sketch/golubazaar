[build]
builder = "NIXPACKS"
# Force Vite to compile assets relative to the current folder instead of absolute root links
buildCommand = "pnpm install --no-frozen-lockfile && pnpm --filter @workspace/golustore exec vite build --base ./"

[deploy]
# Points strictly to the build folder output
startCommand = "npx serve -s artifacts/golustore/dist -l $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
