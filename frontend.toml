[build]
builder = "NIXPACKS"
buildCommand = "pnpm install --no-frozen-lockfile && pnpm --filter @workspace/golustore run build && npm install -g serve"

[deploy]
# Pointing strictly to the actual build output directory folder
startCommand = "serve -s artifacts/golustore/dist -l $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
