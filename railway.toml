[build]
builder = "NIXPACKS"
buildCommand = "pnpm install --no-frozen-lockfile && VITE_CLERK_PUBLISHABLE_KEY=pk_live_YOUR_ACTUAL_KEY pnpm --filter @workspace/golustore run build && pnpm --filter @workspace/api-server run build"

[deploy]
startCommand = "PORT=8080 node artifacts/api-server/dist/index.mjs"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
