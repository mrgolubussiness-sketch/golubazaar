[build]
builder = "NIXPACKS"
buildCommand = "pnpm install --no-frozen-lockfile && pnpm --filter @workspace/golustore run build && pnpm --filter @workspace/api-server run build"

[deploy]
# Single service: API server also serves the compiled frontend static files
startCommand = "PORT=8080 node artifacts/api-server/dist/index.mjs"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
